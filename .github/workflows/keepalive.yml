name: supabase-keepalive

# Triggers are intentionally limited to schedule + manual dispatch only.
# NEVER add a pull_request trigger here: on a public repo that could expose
# the connection-string secrets to forked PRs.
on:
  schedule:
    # Daily at 06:17 UTC. Daily gives margin under Supabase's 7-day inactivity
    # threshold even if GitHub delays/drops a scheduled run.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write # for the heartbeat commit that keeps the repo active
  issues: write # for the failure issue that makes a broken run impossible to miss

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ping all projects (read / write / delete)
        run: node keepalive.mjs
        env:
          # Each connection string is passed explicitly, one line per project.
          #
          # Do NOT replace this with `SECRETS_JSON: ${{ toJSON(secrets) }}`. It is tempting
          # (it makes onboarding config-only), but GitHub's workflow scanner reads bundling
          # every secret into one variable as a possible exfiltration pattern, marks the run
          # "action_required", and dispatches NO jobs. The keepalive then stops silently --
          # no failure email, no log -- until someone notices projects have been paused.
          # This happened on 2026-09-01..09-03. Explicit lines cost one edit per project.
          SUPABASE_DB_URL_TECHSILON_DEV: ${{ secrets.SUPABASE_DB_URL_TECHSILON_DEV }}
          SUPABASE_DB_URL_TECHSILON_PROD: ${{ secrets.SUPABASE_DB_URL_TECHSILON_PROD }}
          SUPABASE_DB_URL_NATNLAB_DEV: ${{ secrets.SUPABASE_DB_URL_NATNLAB_DEV }}
          SUPABASE_DB_URL_NATNLAB_PROD: ${{ secrets.SUPABASE_DB_URL_NATNLAB_PROD }}
          SUPABASE_DB_URL_POLYSILON_DEV: ${{ secrets.SUPABASE_DB_URL_POLYSILON_DEV }}
          SUPABASE_DB_URL_POLYSILON_PROD: ${{ secrets.SUPABASE_DB_URL_POLYSILON_PROD }}

      # `if: always()` is load-bearing. This step keeps the repo active so GitHub does not
      # auto-disable the schedule after 60 days of inactivity (public-repo rule). Without
      # always(), a single bad credential fails the ping step and silently switches off the
      # very protection that stops the whole job being disabled -- which is exactly what
      # happened between 2026-08-18 and 2026-09-04.
      - name: Keep repo active (avoid GitHub's 60-day scheduled-workflow auto-disable)
        if: always()
        run: |
          mkdir -p state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-run.txt
          git commit -m "chore: keepalive heartbeat [skip ci]" || {
            echo "nothing to commit"; exit 0;
          }
          # Deliberately NOT `|| true`: a persistently failing push means the repo goes quiet
          # and the schedule gets auto-disabled 60 days later. Fail loudly instead.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ---------------------------------------------------------------------------------
      # Notification. Two independent mechanisms, because they catch different failures.
      #
      #   (1) The issue below fires when the job RAN and something in it failed.
      #   (2) The dead-man's-switch ping fires by its ABSENCE, and is the only thing that
      #       can catch a run that never dispatched at all -- GitHub blocking the workflow
      #       (`action_required`), the schedule being auto-disabled, the repo being archived.
      #       Both of the 2026-08/09 outages were that second kind, which is why email from
      #       GitHub was never going to be enough: there was no run to email about.
      # ---------------------------------------------------------------------------------

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create keepalive-failure --color B60205 \
            --description "Automated: the keepalive job is failing" 2>/dev/null || true

          body="The scheduled Supabase keepalive failed.

          Run: $RUN_URL
          When: $(date -u +"%Y-%m-%d %H:%M:%SZ")

          Projects pause after ~7 days without a successful ping, so this needs attention
          within days, not weeks. Start with TROUBLESHOOTING.md -- the symptom table maps
          each error string to its cause."

          existing=$(gh issue list --label keepalive-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "keepalive is failing" \
              --label keepalive-failure --body "$body"
          fi

      - name: Close the failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label keepalive-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Recovered: all projects pinged successfully. $RUN_URL"
            echo "closed issue #$existing"
          else
            echo "no open failure issue"
          fi

      # Dead man's switch. Pings ONLY on full success, so silence is the alarm: if this job
      # fails, is blocked, or never runs, the ping stops arriving and the monitoring service
      # alerts. Opt-in -- with no HEALTHCHECK_PING_URL secret set, this is a no-op and says so.
      - name: Dead man's switch ping
        if: success()
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "HEALTHCHECK_PING_URL not set -- external watchdog is NOT active."
            echo "Until it is, a run that never dispatches will go unnoticed."
            echo "See tasks/NEXT_PRIORITIES.md for the one-time setup."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$PING_URL" > /dev/null
          echo "pinged external watchdog"
