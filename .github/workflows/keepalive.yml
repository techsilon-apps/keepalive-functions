name: supabase-keepalive

# Triggers are intentionally limited to schedule + manual dispatch only.
# NEVER add a pull_request trigger here: on a public repo that could expose
# the connection-string secrets to forked PRs.
on:
  schedule:
    # Daily at 06:17 UTC. Daily gives margin under Supabase's 7-day inactivity
    # threshold even if GitHub delays/drops a scheduled run.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write # for the heartbeat commit that keeps the repo active

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Ping all projects (read / write / delete)
        run: node keepalive.mjs
        env:
          # All repo secrets, as one JSON blob (masked in logs). This is what lets
          # onboarding a new project be config-only: no workflow edit needed.
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: Keep repo active (avoid GitHub's 60-day scheduled-workflow auto-disable)
        run: |
          mkdir -p state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-run.txt
          git commit -m "chore: keepalive heartbeat [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
